<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Offline Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; background: #f0f0f0; }
        .dot-icon { display: flex; justify-content: center; align-items: center; }
        .dot { width: 14px; height: 14px; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.3); }
        .bg-red { background-color: #d32f2f; }
        .bg-blue { background-color: #007AFF; }
        .bg-green { background-color: #4CAF50; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', { zoomControl: false }).setView([26.5915, 127.9775], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        var routeLayer = null;
        var userMarkers = {};
        var shelterMarkers = [];
        var destinationMarker = null;

        // 地図上の何もない場所をタップした場合
        map.on('click', function(e) {
            var msg = JSON.stringify({ type: 'mapTap', lat: e.latlng.lat, lng: e.latlng.lng });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
        });

        function handleMessage(data) {
            try {
                var message = JSON.parse(data);

                // --- 経路描画 ---
                if (message.type === 'drawRoute') {
                    if (routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.polyline(message.coordinates, { color: '#007AFF', weight: 6, opacity: 0.7, lineJoin: 'round' }).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), { padding: [80, 80] });
                }

                // --- ユーザー位置の更新 ---
                if (message.type === 'updateUsers') {
                    message.users.forEach(function(u) {
                        var icon = L.divIcon({ className: 'dot-icon', html: '<div class="dot bg-blue"></div>', iconSize: [18, 18] });
                        if (userMarkers[u.id]) userMarkers[u.id].setLatLng([u.lat, u.lng]);
                        else userMarkers[u.id] = L.marker([u.lat, u.lng], { icon: icon }).addTo(map);
                    });
                }

                // --- 避難所マーカーの表示 (タップイベント付き) ---
                if (message.type === 'updateShelters') {
                    shelterMarkers.forEach(m => map.removeLayer(m));
                    shelterMarkers = [];
                    var icon = L.divIcon({ className: 'dot-icon', html: '<div class="dot bg-red"></div>', iconSize: [18, 18] });
                    message.shelters.forEach(function(s) {
                        var m = L.marker([s.lat, s.lng], { icon: icon }).addTo(map).bindPopup("避難所: " + s.name);
                        
                        // ★ 避難所アイコンタップ時にRNへ通知
                        m.on('click', function() {
                            var tapMsg = JSON.stringify({ type: 'shelterTap', lat: s.lat, lng: s.lng, name: s.name });
                            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(tapMsg);
                        });

                        shelterMarkers.push(m);
                    });
                }

                // --- 目的地ピンの更新 ---
                if (message.type === 'updateDestinationPin') {
                    if (destinationMarker) map.removeLayer(destinationMarker);
                    
                    // ★ 目的地が避難所の場合は緑色のピンを表示しない（赤色のままにする）
                    if (message.isShelter) {
                        destinationMarker = null;
                        return;
                    }

                    var icon = L.divIcon({ className: 'dot-icon', html: '<div class="dot bg-green"></div>', iconSize: [18, 18] });
                    destinationMarker = L.marker([message.lat, message.lng], { icon: icon }).addTo(map);
                }

            } catch (e) { console.error("Map JS Error: " + e); }
        }

        document.addEventListener("message", function(e) { handleMessage(e.data); });
        window.addEventListener("message", function(e) { handleMessage(e.data); });
    </script>
</body>
</html>
